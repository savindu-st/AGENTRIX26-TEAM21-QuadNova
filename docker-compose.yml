version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:5173"  # Changed host port to 3000 to bypass Windows port blocking
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

  admin-frontend:
    build:
      context: ./admin-frontend
    ports:
      - "3001:5174"  # Changed host port to 3001 to bypass Windows port blocking
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
